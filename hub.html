<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Mode</title>

    <!-- Switzer is bundled locally (see @font-face in hub.css) — no external requests. -->
    <link rel="stylesheet" href="hub.css" />
  </head>
  <body>
    <main class="hub">
      <header class="hub__head">
        <h1 class="hub__thesis">Create, not consume.</h1>
      </header>

      <nav class="actions" aria-label="Create on LinkedIn">
        <button class="row" id="post" type="button">
          <span class="row__body">
            <span class="row__title">Post something</span>
            <span class="row__sub">Open the composer</span>
          </span>
          <span class="row__arrow" aria-hidden="true">↗</span>
        </button>
        <button class="row" id="messages" type="button">
          <span class="row__body">
            <span class="row__title">Messages</span>
            <span class="row__sub">Reply and reach out</span>
          </span>
          <span class="row__arrow" aria-hidden="true">↗</span>
        </button>
      </nav>

      <section class="commit" id="commit" aria-live="polite">
        <div class="commit__bar">
          <span class="label">Block the feed</span>
          <span class="label commit__state" id="commitState">Not blocked</span>
        </div>

        <p class="commit__headline" id="commitTitle" hidden></p>
        <p class="commit__subline">
          <span class="commit__sub" id="commitSub">Get off LinkedIn. Do something productive. Or fun!</span>
          <!-- Break-the-lock affordance, inline with the "Locked until" line when blocked -->
          <button class="breaklink" id="breakLink" type="button" hidden></button>
        </p>

        <div class="seg" id="durations" role="group" aria-label="Block duration"></div>

        <div class="confirm" id="confirm" hidden>
          <span class="confirm__text" id="confirmText"></span>
          <button class="confirm__go label" id="confirmGo" type="button">Lock it in</button>
        </div>

        <div class="breakbox" id="breakBox" hidden>
          <p class="breakbox__title">Back to the scroll.</p>
          <p class="breakbox__body" id="breakBody"></p>
          <div class="breakbox__actions">
            <button class="breakbox__stay" id="breakStay" type="button">Stay locked</button>
            <button class="breakbox__pay" id="breakPay" type="button"></button>
          </div>
        </div>

        <div class="awaiting" id="awaiting" hidden>
          <span class="awaiting__text">Finish checkout in the other tab — this unlocks when payment clears.</span>
          <button class="awaiting__cancel" id="breakCancel" type="button">Cancel</button>
        </div>
      </section>
    </main>

    <script src="hub.js"></script>
  </body>
</html>
