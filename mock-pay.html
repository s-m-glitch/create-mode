<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout (mock)</title>
    <link
      href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg:#080b16; --on:#eef1f7; --dim:rgba(238,241,247,.6); --line:rgba(238,241,247,.1);
        --teal:#5fe7d2; --teal-bright:#86f4e2; --teal-glow:rgba(95,231,210,.35);
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh; color: var(--on);
        background:
          radial-gradient(820px 560px at 50% -12%, rgba(95,231,210,.12), transparent 60%),
          radial-gradient(680px 520px at 86% 8%, rgba(96,132,255,.12), transparent 55%),
          var(--bg);
        font-family: "Switzer", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 32px;
      }
      .card { width: 100%; max-width: 380px; text-align: center; }
      .tag {
        font-size: 10.5px; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
        color: var(--dim);
      }
      .amount { font-size: 44px; font-weight: 500; letter-spacing: -.02em; margin: 14px 0 6px; }
      .desc { font-size: 14px; color: var(--dim); margin-bottom: 32px; line-height: 1.5; }
      button {
        width: 100%; padding: 14px; border: 0; border-radius: 11px; cursor: pointer;
        font-family: inherit; font-size: 14px; font-weight: 600; color: #06241f;
        background: linear-gradient(180deg, var(--teal-bright), var(--teal));
        box-shadow: 0 6px 22px -8px var(--teal-glow); transition: filter .18s ease;
      }
      button:hover { filter: brightness(1.05); }
      .done { display: none; }
      .done .amount { font-size: 26px; }
      .muted { font-size: 12.5px; color: var(--dim); margin-top: 18px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main class="card" id="checkout">
      <p class="tag">Mock checkout</p>
      <p class="amount" id="amount">$0</p>
      <p class="desc">Break your Create Mode lock — back to the scroll.</p>
      <button id="pay">Pay (simulate)</button>
      <p class="muted">Stand-in for Stripe. Clicking "pay" marks this break paid so the hub unlocks — no real charge.</p>
    </main>

    <main class="card done" id="done">
      <p class="tag">Paid</p>
      <p class="amount">Payment complete.</p>
      <p class="desc">Return to Create Mode — your lock is lifting now.</p>
      <p class="muted">You can close this tab.</p>
    </main>

    <script src="mock-pay.js"></script>
  </body>
</html>
