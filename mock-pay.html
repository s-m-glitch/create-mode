<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout (mock)</title>
    <link
      href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink:#11151e; --dim:rgba(17,21,30,.66); --yellow:#ecf23f; --yellow-deep:#dde22f;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh; color: var(--ink);
        background:
          radial-gradient(680px 320px at 73% 24%, rgba(255,255,255,.6), transparent 62%),
          radial-gradient(900px 240px at 50% 118%, rgba(120,200,130,.55), transparent 60%),
          linear-gradient(180deg, #7eb7e8 0%, #b4dcf4 54%, #dcecf7 100%);
        background-attachment: fixed;
        font-family: "Switzer", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased; display: grid; place-items: center; padding: 32px;
      }
      .card { width: 100%; max-width: 380px; text-align: center; }
      .tag {
        font-size: 10.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
        color: var(--dim);
      }
      .amount { font-size: 44px; font-weight: 800; letter-spacing: -.03em; margin: 14px 0 6px; }
      .desc { font-size: 14px; color: var(--dim); margin-bottom: 32px; line-height: 1.5; font-weight: 500; }
      button {
        width: 100%; padding: 14px; border: 0; border-radius: 12px; cursor: pointer;
        font-family: inherit; font-size: 14px; font-weight: 700; color: var(--ink);
        background: var(--yellow); transition: background .18s ease;
      }
      button:hover { background: var(--yellow-deep); }
      .done { display: none; }
      .done .amount { font-size: 26px; }
      .muted { font-size: 12.5px; color: var(--dim); margin-top: 18px; line-height: 1.5; font-weight: 500; }
    </style>
  </head>
  <body>
    <main class="card" id="checkout">
      <p class="tag">Mock checkout</p>
      <p class="amount" id="amount">$0</p>
      <p class="desc">Break your Create Mode lock — back to the scroll.</p>
      <button id="pay">Pay (simulate)</button>
      <p class="muted">Stand-in for Stripe. Clicking "pay" marks this break paid so the hub unlocks — no real charge.</p>
    </main>

    <main class="card done" id="done">
      <p class="tag">Paid</p>
      <p class="amount">Payment complete.</p>
      <p class="desc">Return to Create Mode — your lock is lifting now.</p>
      <p class="muted">You can close this tab.</p>
    </main>

    <script src="mock-pay.js"></script>
  </body>
</html>
